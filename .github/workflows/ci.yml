name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # -timeout 30m: Microsoft-hosted Windows runners are 3-5x slower
      # than Linux for our I/O-heavy workload (NTFS small-file ops +
      # Defender real-time scanning + Windows process-spawn cost).
      # The api package has been the dominant cost for some time
      # (~6-10 min historical, hovering near the prior 20m budget after
      # PR #63 added stuck-records tests; one Windows run timed out
      # at exactly 20m). Bumped from 20m -> 30m to give headroom on
      # natural growth; the structural fix is splitting the api
      # package so each subpackage gets its own budget (#56). The job
      # wrapper bumped to 45m so this per-package timeout can actually
      # fire before the wall-clock kill.
      # Linux/macOS finish well under 20m and are unaffected.
      - run: go test -timeout 30m ./...

  test-race:
    name: test-race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # -short skips the scale-derived heavy tests (TestScaleMeasurement
      # at non-default sizes, the full cli/integration suite) which trip
      # Windows' default 10-min per-package alarm under race-detector
      # overhead. Non-race CI still exercises them at full scale on every
      # platform. -timeout 20m is the per-package go-test budget;
      # test-race can spike under runner variability even with -short.
      - run: go test -race -short -timeout 20m ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
