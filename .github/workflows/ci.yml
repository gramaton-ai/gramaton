name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # -timeout 20m: Microsoft-hosted Windows runners are 3-5x slower
      # than Linux for our I/O-heavy workload (NTFS small-file ops +
      # Defender real-time scanning + Windows process-spawn cost).
      # The api package alone needs ~6-10 min on a slow Windows runner
      # at current test sizing -- the default 10m per-package budget
      # is too tight after we've already trimmed the obvious outliers
      # (#51 fixed TestCaptureBatchAsyncLargerThanSyncCap; #53 skipped
      # TestCollectionPerformance + TestCaptureBatchWallClockSpeedup
      # on Windows). Linux/macOS finish well under 10m and are
      # unaffected by the larger budget.
      - run: go test -timeout 20m ./...

  test-race:
    name: test-race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # -short skips the scale-derived heavy tests (TestScaleMeasurement
      # at non-default sizes, TestCaptureBatchAsyncLargerThanSyncCap, the
      # full cli/integration suite) which trip Windows' 10-min per-package
      # alarm under race-detector overhead. Non-race CI still exercises
      # them at full scale on every platform.
      - run: go test -race -short ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
