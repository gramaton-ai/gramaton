name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Defender real-time scanning intercepts every file write/read on
      # NTFS, adding ~30-40% overhead to the test suite (we create
      # thousands of small files via t.TempDir, bbolt, mmap setup, etc.).
      # Safe to disable on the ephemeral CI runner because: (a) all Go
      # deps are vetted + checksum-verified via go.sum, (b) the runner
      # VM is destroyed after the job (no persistence), (c) Defender's
      # signature-based scanning provides ~zero protection against the
      # supply-chain attacks we'd actually care about. Reversible
      # two-line revert if our threat model ever changes.
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go test ./...

  test-race:
    name: test-race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # -short skips the scale-derived heavy tests (TestScaleMeasurement
      # at non-default sizes, TestCaptureBatchAsyncLargerThanSyncCap, the
      # full cli/integration suite) which trip Windows' 10-min per-package
      # alarm under race-detector overhead. Non-race CI still exercises
      # them at full scale on every platform.
      - run: go test -race -short ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
