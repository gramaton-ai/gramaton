name: backlog
description: Dev ticket backlog with rich per-item metadata. Standard curation runs classification, summarization, and concept detection on captured rationale; contradictions on so design conflicts between tickets surface.
clear_mode: resolve
supersession: collection
curation: standard
contradictions: on
schema:
  fields:
    - name: title
      type: string
      required: true
    - name: status
      type: enum
      required: true
      values: [open, in_progress, resolved, abandoned]
    - name: severity
      type: enum
      required: false
      values: [P0, P1, P2, P3]
    - name: area
      type: string
      required: false
    - name: details
      type: string
      required: false
    - name: file_refs
      type: string
      required: false
  content_fields: [title, details]
