name: packing-list
description: Trip-scoped packing checklist. One-off so items are ephemeral; curation off because LLM passes add nothing to "socks" or "charger". Same-list dedup keeps the checklist clean; contradictions are meaningless on packed/unpacked items.
clear_mode: resolve
curation: none
contradictions: off
schema:
  fields:
    - name: title
      type: string
      required: true
    - name: category
      type: string
      required: false
    - name: packed
      type: boolean
      required: false
